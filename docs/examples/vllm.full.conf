# 容器内将本文件保存为当前目录的 .vllm.conf，执行 vllm-suite。
# 本例选全四阶段和九个科目；服务地址、模型标识及挂载路径按实际部署填写。
model:
  name: default
  base_url: http://target-server:8000/v1
  tokenizer: /nas/modelscope/models/Qwen--Qwen2.5-7B-Instruct/snapshots/master
  api_key_env: TARGET_API_KEY       # 无鉴权服务可省略
  temperature: 0                    # 精度生成参数；压测采样参数在 bench 中设置
  max_tokens: 2048
  timeout: 60                       # 秒

execution:
  perf:
    stage: all                      # all / connectivity / scan / overload / soak / single
    concurrency: [1, 2, 4, 8, 16, 32, 64, 128]
    requests_per_concurrency: 10
    overload_concurrency: [192, 256] # 每档 3 轮，每轮并发 C、请求数 C
    soak_requests: 1000
    slo:
      ttft_ms: 2000
      tpot_ms: 50
    immutable_snapshots: []         # 可填存储端保证不可变的 /nas/.snapshot/... 目录
    bench:                          # 追加到默认参数后；每个元素是一个 argv 字符串
      - --backend
      - openai-chat
      - --endpoint
      - /v1/chat/completions
      - --dataset-name
      - random
      - --seed
      - "42"
      - --metric-percentiles
      - "50,95,99"
      - --percentile-metrics
      - "ttft,tpot,itl,e2el"
      - --save-result
      - --save-detailed              # 可选；省略时保留精简汇总
    profiles:
      - name: 4k
        bench: [--random-input-len, "4096", --random-output-len, "1536"]
      - name: 16k
        bench: [--random-input-len, "16384", --random-output-len, "512"]
      - name: 64k
        bench: [--random-input-len, "65536", --random-output-len, "1536"]

  accuracy:
    datasets: [ceval, logiqa-zh, mathbench, cmrc2018, longbench, finsafetybench, financeiq, halluqa, followbench]
    dataset_map: /config/datasets.local.json  # 显式覆盖时这个文件须存在；标准布局可省略
    concurrency: 8
    judge_concurrency: 4
    continue_on_error: true
    judge:
      name: judge-model
      base_url: http://judge-server:8000/v1
      api_key_env: JUDGE_API_KEY
      temperature: 0
      max_tokens: 1024
      timeout: 60
    followbench:
      language: en                  # en / zh
    options:
      ceval: {}                     # 例如 {subsets: [ceval-computer_network], limit: 5}
      logiqa-zh: {}
      mathbench: {}
      cmrc2018: {}
      longbench: {}
      financeiq: {}
      finsafetybench: {language: both}  # en / zh / both；支持 limit
      halluqa: {}                   # 完整数据，不支持 subsets / limit
      followbench: {}               # 语言在 accuracy.followbench 中指定

# 单次官方模式：用下面这段替换整个 execution.perf。accuracy 可独立保留或省略。
# perf:
#   stage: single
#   bench: [--backend, openai-chat, --endpoint, /v1/chat/completions,
#           --dataset-name, random, --random-input-len, "4096", --random-output-len, "1536",
#           --num-prompts, "128", --max-concurrency, "16", --request-rate, inf,
#           --seed, "42", --save-result, --save-detailed]
#
# vLLM 0.11.0 的其余官方参数示例。下面每行是可按需加入 bench 的 argv 片段。
# 模型连接参数由 model 生成；原生 single 模式允许透传所有官方参数。
# [--model, default, --tokenizer, /nas/my-tokenizer, --base-url, 'http://target-server:8000']
# [--host, target-server, --port, "8000"]   # 使用官方 host/port 模式；显式 --base-url 与此模式互斥
# [--endpoint-type, openai-chat]            # 旧参数，优先使用 --backend
# [--served-model-name, default, --tokenizer-mode, auto]
# [--trust-remote-code]                     # 只在支持自定义 tokenizer 的单次模式使用
# [--header, 'X-Team=eval', 'X-Run=nightly']
# [--label, baseline, --request-id-prefix, eval-]
# [--metadata, 'suite=nightly', 'profile=4k']
# [--disable-tqdm]
# [--lora-modules, adapter-a, adapter-b]
# [--logprobs, "1", --top-p, "0.9", --top-k, "20", --min-p, "0.05", --temperature, "0.7"]
# [--use-beam-search]                       # 官方解析器提供；效果取决于对应后端实现
# [--ignore-eos]
# [--goodput, 'ttft:2000', 'tpot:50']
# [--result-dir, exports, --result-filename, native.json]  # single 写入本次 perf/exports/
# [--append-result]
# [--burstiness, "1.0"]
# [--ready-check-timeout-sec, "60", --profile] # profile 需要服务端启用 profiler
# [--ramp-up-strategy, linear, --ramp-up-start-rps, "1", --ramp-up-end-rps, "20"]
#
# 数据集片段：切换数据集时替换对应的 --dataset-name 及其专用参数。
# [--no-stream]                      # 数据集加载方式
# [--no-oversample]                  # 样本不足时不重复采样
# [--random-prefix-len, "0", --random-range-ratio, "0", --random-batch-size, "1"]
# [--dataset-name, sharegpt, --dataset-path, /nas/sharegpt.json, --sharegpt-output-len, "512"]
# [--dataset-name, custom, --dataset-path, /nas/custom.jsonl, --custom-output-len, "512", --custom-skip-chat-template]
# [--dataset-name, sonnet, --dataset-path, /nas/sonnet.txt, --sonnet-input-len, "1024", --sonnet-output-len, "128", --sonnet-prefix-len, "200"]
# [--dataset-name, spec_bench, --dataset-path, /nas/spec.jsonl, --spec-bench-output-len, "128", --spec-bench-category, translation]
# [--dataset-name, burstgpt, --dataset-path, /nas/burstgpt.csv]
# [--dataset-name, hf, --dataset-path, /nas/hf-data, --hf-name, 'likaixin/InstructCoder', --hf-subset, default, --hf-split, train, --hf-output-len, "128"]
#   hf-name、subset 和 split 应与所选官方适配器及本地数据集一致。
# [--blazedit-min-distance, "0", --blazedit-max-distance, "100"]  # 官方 HF Blazedit 适配器
# [--dataset-name, prefix_repetition, --prefix-repetition-prefix-len, "256", --prefix-repetition-suffix-len, "128", --prefix-repetition-num-prefixes, "2", --prefix-repetition-output-len, "128"]
# [--dataset-name, random-mm, --backend, openai-chat, --random-mm-base-items-per-request, "1", --random-mm-num-mm-items-range-ratio, "0", --random-mm-limit-mm-per-prompt, '{"image":1,"video":0}', --random-mm-bucket-config, '{(256,256,1):1.0}']
